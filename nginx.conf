events { worker_connections 1024; }

http {
    upstream mi_web_cluster {
        server backend-1:8080;
        server backend-2:8080;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://mi_web_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

}
