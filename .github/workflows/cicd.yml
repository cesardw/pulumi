
name: Pulumi CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permisos necesarios para GitHub OIDC
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar repositorio2
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # 2. Configurar Python
      - name: Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Instalar dependencias
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Autenticarse en AWS mediante OIDC
      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::615299762808:role/GitHubActionsPulumiRole
          aws-region: us-east-1
          role-session-name: GitHubActionsPulumi

      # 5. Validar identidad AWS
      - name: Verificar identidad AWS
        run: aws sts get-caller-identity

      # 6. Iniciar sesión en Amazon ECR
      - name: Login en Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 7. Escaneo de seguridad con Trivy
      - name: Ejecutar escaneo de vulnerabilidades con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          security-checks: 'vuln,config'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      # 8. Definir el stack de Pulumi dinámicamente según la rama o selección manual
      - name: Determinar Stack de Pulumi
        id: set-stack
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "STACK_NAME=${{ inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" == "main" ]; then
            echo "STACK_NAME=aws-prod" >> $GITHUB_OUTPUT
          else
            echo "STACK_NAME=aws-dev" >> $GITHUB_OUTPUT
          fi

      # 9. Previsualización de cambios con Pulumi (Preview)
      - name: Ejecutar Preview con Pulumi
        uses: pulumi/actions@v5
        with:
          command: preview
          stack-name: ${{ steps.set-stack.outputs.STACK_NAME }}
          work-dir: .
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      # 10. Despliegue formal en AWS con Pulumi (Up)
      - name: Ejecutar Despliegue con Pulumi
        uses: pulumi/actions@v5
        with:
          command: up
          stack-name: ${{ steps.set-stack.outputs.STACK_NAME }}
          work-dir: .
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

      # 11. Notificar resultado a Slack
      - name: Notificar resultado a Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" == "success" ]; then
            EMOJI=":white_check_mark:"
            TEXT="Workflow *${{ github.workflow }}* completado con éxito en *${{ github.repository }}* (rama \`${{ github.ref_name }}\`)."
          else
            EMOJI=":x:"
            TEXT="Workflow *${{ github.workflow }}* falló en *${{ github.repository }}* (rama \`${{ github.ref_name }}\`). Revisa los logs."
          fi

          curl -s -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"${EMOJI} ${TEXT}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Ver ejecución en GitHub>\"}" \
            "$SLACK_WEBHOOK_URL"