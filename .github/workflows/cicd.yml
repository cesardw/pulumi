
name: Pulumi CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permisos necesarios para GitHub OIDC
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar repositorio
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # 2. Configurar Python
      - name: Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Instalar dependencias
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Autenticarse en AWS mediante OIDC
      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::615299762808:role/GitHubActionsPulumiRole
          aws-region: us-east-1
          role-session-name: GitHubActionsPulumi

      # 5. Validar identidad AWS
      - name: Verificar identidad AWS
        run: aws sts get-caller-identity

      # 6. Iniciar sesión en Amazon ECR
      - name: Login en Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 7. Ejecutar despliegue Pulumi
      - name: Ejecutar despliegue con Pulumi
        uses: pulumi/actions@v5
        with:
          command: up
          stack-name: aws-dev
          work-dir: .
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
